name: Keep Supabase alive

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a public.keep_alive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          url="${url%/}"
          key="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"

          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Faltan los secrets SUPABASE_URL y/o SUPABASE_ANON_KEY"
            exit 1
          fi

          codigo=$(curl --silent --show-error --max-time 30 \
            -o respuesta.txt -w '%{http_code}' \
            -X POST "$url/rest/v1/rpc/keep_alive" \
            -H "apikey: $key" \
            -H "Authorization: Bearer $key" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP $codigo - Supabase respondió: $(cat respuesta.txt)"

          [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]
